<body>
<header class="top"><div class="brand"><img class="logo" src="/logo.png" alt="لوگوی اتوبنز وحدت"><div><h1>اتوبنز وحدت</h1></div></div><div class="right"><span class="pill" id="branchLabel">تهران</span><img class="taxi" src="/assets/samand.png" alt="تاکسی سمند زرد"></div></header>
<div class="shell"><aside class="side">
<button type="button" class="nav active" id="nav-home" onclick="go('home')"><span class="sym"><svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><use href="/assets/icons.svg#home"></use></svg></span><span class="text">خانه</span></button>
<button type="button" class="nav" id="nav-new" onclick="go('new')"><span class="sym"><svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><use href="/assets/icons.svg#new"></use></svg></span><span class="text">صدور بارنامه</span></button>
<button type="button" class="nav" id="nav-scan" onclick="go('scan')"><span class="sym"><svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><use href="/assets/icons.svg#scan"></use></svg></span><span class="text">دریافت بار</span></button>
<button type="button" class="nav" id="nav-list" onclick="go('list')"><span class="sym"><svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><use href="/assets/icons.svg#list"></use></svg></span><span class="text">بارنامه‌ها</span></button>
<button type="button" class="nav" id="nav-reports" onclick="go('reports')"><span class="sym"><svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><use href="/assets/icons.svg#reports"></use></svg></span><span class="text">گزارش مالی</span></button>
<button type="button" class="nav" id="nav-settings" onclick="go('settings')"><span class="sym"><svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><use href="/assets/icons.svg#settings"></use></svg></span><span class="text">تنظیمات</span></button>
</aside><main class="content" id="page"></main></div>
<script>
"use strict";
var state={page:"home",settings:{origin:"تهران",destinations:["قائم‌شهر"]},current:null,period:"today"};
var fa=new Intl.NumberFormat("fa-IR");
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function latin(v){return String(v||"").replace(/[۰-۹]/g,function(d){return String(d.charCodeAt(0)-1776)}).replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-1632)})}
function num(v){return Number(latin(v).replace(/[^0-9]/g,"")||"0")}
function fmt(v){return fa.format(Number(v)||0)}
function money(v){return fmt(v)+" تومان"}
function groupField(el){var s=latin(el.value).replace(/\D/g,"");if(s.length>15)s=s.slice(0,15);el.value=s?fmt(s):"";calculate()}
function calculate(){var keys=["prepaid","post_fare","storage_fee","other_fee"];var total=keys.reduce(function(a,k){var e=document.getElementById(k);return a+num(e?e.value:0)},0);var e=document.getElementById("fareTotal");if(e)e.textContent=money(total)}
async function api(url,opts){var response=await fetch(url,Object.assign({cache:"no-store"},opts||{}));var data=await response.json();if(!response.ok)throw Error(data.error||"خطای ارتباط با برنامه");return data}
function post(url,value){return api(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(value)})}
function icon(name){return '<svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><use href="/assets/icons.svg#'+name+'"></use></svg>'}
function section(name,text){return '<h3 class="section-title">'+icon(name)+esc(text)+'</h3>'}
function title(t,action){return '<div class="pagehead"><h2>'+icon(({home:'home',new:'new',scan:'scan',list:'list',detail:'list',reports:'reports',settings:'settings'})[state.page]||'home')+esc(t)+'</h2>'+(action||"")+'</div>'}
function row(k,v){return '<div class="keyrow"><span>'+esc(k)+'</span><span>'+esc(v)+'</span></div>'}
function field(id,label,value,extra){return '<div class="field"><label for="'+esc(id)+'">'+esc(label)+'</label><input id="'+esc(id)+'" value="'+esc(value||"")+'" '+(extra||"")+'></div>'}
function card(content,cls){return '<div class="card '+esc(cls||"")+'">'+content+'</div>'}
function set(html){document.getElementById("page").innerHTML=html;document.getElementById("page").setAttribute("data-page",state.page);window.scrollTo({top:0,behavior:"instant"})}
function fail(e){alert(e.message||String(e))}
function nav(p){document.querySelectorAll(".nav").forEach(function(e){e.classList.toggle("active",e.id==="nav-"+p)})}
async function go(p){state.page=p;nav(p);try{
if(p==="home")home();
if(p==="new")newForm();
if(p==="scan")scanForm();
if(p==="list")await listings();
if(p==="reports")await reports();
if(p==="settings")await settingsForm();
}catch(e){fail(e)}}
function home(){set(title("خانه")+card('<div class="home-route">'+icon('route')+'<strong>تهران</strong><span class="route-arrow">←</span><span>'+esc(state.settings.destinations[0]||"—")+'</span></div>','home-route-card')+
'<div class="home-actions">'+[['new','صدور بارنامه'],['scan','دریافت بار'],['list','بارنامه‌ها'],['reports','گزارش مالی']].map(function(x){return '<button class="tile" onclick="go(&quot;'+x[0]+'&quot;)"><span class="big">'+icon(x[0])+'</span><strong>'+x[1]+'</strong>'+icon('arrow')+'</button>'}).join('')+'</div>')}
function newForm(){
var destinations=(state.settings.destinations||[]).slice().sort(function(a,b){return a==="قائم‌شهر"?-1:b==="قائم‌شهر"?1:0});
var dest='<div class="field"><label for="destination">مقصد</label><select id="destination">'+destinations.map(function(d){return '<option value="'+esc(d)+'">'+esc(d)+'</option>'}).join("")+'</select></div>';
set(title("صدور بارنامه")+'<div class="issuance">'+card(section('box','مشخصات بار')+
'<div class="origin">'+icon('route')+'<span>مبدأ</span><strong>تهران</strong></div><div class="fields">'+dest+field('pieces','تعداد بسته','۱','inputmode="numeric"')+
field('sender','نام فرستنده','')+field('receiver','نام گیرنده','')+
'<div class="field full"><label for="phone">موبایل گیرنده</label><input id="phone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel"></div></div>')+
card(section('money','کرایه و هزینه‌ها (تومان)')+'<div class="fields">'+
[['prepaid','پیش‌کرایه'],['post_fare','پس‌کرایه'],['storage_fee','انبارداری'],['other_fee','سایر هزینه‌ها']].map(function(x){return field(x[0],x[1],'','inputmode="numeric" class="money" oninput="groupField(this)"')}).join('')+
'</div><div class="sum"><span>جمع کل کرایه</span><span id="fareTotal">۰ تومان</span></div><div class="toolbar issue-actions"><button id="issueButton" class="btn" onclick="create()">'+icon('new')+'صدور بارنامه</button></div>','fare-card')+'</div>')
}
async function create(){var button=document.getElementById("issueButton");if(button&&button.disabled)return;if(button)button.disabled=true;try{
var keys=["destination","sender","receiver","phone","pieces","prepaid","post_fare","storage_fee","other_fee"];
var d={};keys.forEach(function(k){var e=document.getElementById(k);d[k]=e?e.value:""});
if(!document.getElementById("destination"))d.destination=state.settings.destinations[0]||"";
["prepaid","post_fare","storage_fee","other_fee","pieces"].forEach(function(k){d[k]=num(d[k])});
var r=await post("/api/waybills",d);await showBill(r.waybill.id,true)
}catch(e){fail(e)}finally{if(button)button.disabled=false}}
function scanForm(){
set(title('دریافت بار')+card('<div class="scanbox"><div class="scan-emblem">'+icon('scan')+'</div><label for="qrInput">QR</label><input id="qrInput" dir="ltr" autocomplete="off" spellcheck="false" aria-label="QR"><button class="btn green" onclick="importQr()">'+icon('scan')+'خواندن بارنامه</button></div>','scan-card'));
var inp=document.getElementById('qrInput');inp.focus();inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();importQr()}})
}
async function importQr(){try{
var input=document.getElementById("qrInput");if(!input||!input.value.trim())return;
var r=await post("/api/import",{qr:input.value.trim()});
await showBill(r.waybill.id,false);
if(!r.fresh)alert("قبلاً ثبت شده است.");
}catch(e){fail(e)}}
async function listings(){
var q=state.search||'';
set(title('بارنامه‌ها')+card('<div class="list-toolbar">'+icon('search')+'<div class="field"><label for="search">جست‌وجو</label><input id="search" value="'+esc(q)+'" oninput="searchBills(this.value)"></div></div><div id="listContent">در حال دریافت...</div>'));
await searchBills(q)
}
var searchRequest=0;
async function searchBills(q){state.search=q;var requestId=++searchRequest;
try{
var data=await api("/api/waybills?q="+encodeURIComponent(q||""));
if(requestId!==searchRequest||state.page!=="list")return;
var html='<div class="tablewrap"><table><thead><tr><th>شماره</th><th>مسیر</th><th>گیرنده</th><th>جمع کل</th><th>وضعیت</th><th></th></tr></thead><tbody>';
data.items.forEach(function(b){
html+='<tr><td><span class="bill-no">'+fmt(b.number)+'</span></td><td>'+esc(b.origin)+' ← '+esc(b.destination)+'</td><td>'+esc(b.receiver)+'</td><td>'+money(b.total)+'</td><td><span class="tag '+(b.delivered_at?"green":b.received_at?"gold":"")+'">'+esc(b.status)+'</span></td><td><button class="btn secondary" data-id="'+esc(b.id)+'" onclick="showBill(this.dataset.id)">نمایش</button></td></tr>';
});
html+='</tbody></table></div>';
if(!data.items.length)html='<div class="muted">بارنامه‌ای نیست.</div>';
var e=document.getElementById("listContent");if(e)e.innerHTML=html;
}catch(e){fail(e)}}
async function showBill(id,showQR){
try{
state.current=id;
var r=await api("/api/waybills/"+encodeURIComponent(id));var b=r.waybill;
state.page="detail";nav("list");
var status=b.delivered_at?"green":"";
var html=title("جزئیات بارنامه",
'<div class="toolbar noprint"><button class="btn secondary" onclick="go(&quot;list&quot;)">'+icon('arrow')+'بازگشت</button><button class="btn secondary" onclick="window.print()">'+icon('print')+'چاپ</button></div>')+
'<div class="grid2"><div>'+card(
'<h3 class="section-title">'+icon('list')+'مشخصات بارنامه <span class="tag '+status+'">'+esc(b.status)+'</span></h3>'+
row("شماره بارنامه",fmt(b.number))+row("مبدأ",b.origin)+row("مقصد",b.destination)+row("فرستنده",b.sender)+row("گیرنده",b.receiver)+row("موبایل گیرنده",b.phone)+row("تعداد بسته",fmt(b.pieces))+
row("صدور",b.created_at_fa)+(b.received_at?row("ثبت دریافت",b.received_at_fa):"")+
(b.delivered_at?row("ثبت تحویل",b.delivered_at_fa):""))+'</div><div>'+
card(section('money','حساب مالی')+row("پیش‌کرایه",money(b.prepaid))+
row("پس‌کرایه",money(b.post_fare))+row("انبارداری",money(b.storage_fee))+
row("سایر هزینه‌ها",money(b.other_fee))+
'<div class="sum"><span>جمع کل</span><span>'+money(b.total)+'</span></div>'+
row("مانده",money(b.due))+
(b.delivered_at?row("وصول‌شده در مقصد",money(b.post_collected)):""))+
card(section('scan','QR بارنامه')+'<img class="qr" alt="QR بارنامه" src="/api/qr/'+encodeURIComponent(b.id)+'">')+'</div></div>';
if(!b.received_at)html+=card('<button class="btn green" onclick="receive()">'+icon('scan')+'ثبت دریافت بار</button>');
else if(!b.delivered_at)html+=card('<h3>تحویل بار به گیرنده</h3><div class="fields">'+
field("person","نام تحویل‌گیرنده",b.receiver)+
field("collected","مبلغ وصولی",fmt(b.due),'class="money" inputmode="numeric" oninput="groupField(this)"')+
'</div><button class="btn green" onclick="deliver()">'+icon('box')+'ثبت تحویل</button>');
else html+=card('<div class="tag green">بار تحویل شده است</div>'+row("تحویل‌گیرنده",b.delivered_to));
set(html)
}catch(e){fail(e)}}
async function receive(){try{await post("/api/waybills/"+encodeURIComponent(state.current)+"/receive",{});showBill(state.current)}catch(e){fail(e)}}
async function deliver(){try{await post("/api/waybills/"+encodeURIComponent(state.current)+"/deliver",
{person:document.getElementById("person").value,collected:num(document.getElementById("collected").value)});showBill(state.current)}catch(e){fail(e)}}
async function reports(){
var p=state.period;var d=await api('/api/reports?period='+p);
var periods='<div class="periods">'+[['today','امروز'],['month','این ماه'],['all','همه']].map(function(x){return '<button class="btn '+(p===x[0]?'':'secondary')+'" aria-pressed="'+(p===x[0])+'" onclick="setPeriod(&quot;'+x[0]+'&quot;)">'+x[1]+'</button>'}).join('')+'</div>';
var stats='<div class="report-stats">'+[['جمع کل کرایه','total','total','money'],['پیش‌کرایه','prepaid','green','money'],['پس‌کرایه','post_fare','','money'],['انبارداری','storage_fee','gold','box'],['سایر هزینه‌ها','other_fee','purple','reports']].map(function(x){return '<div class="stat '+x[2]+'"><div class="stat-heading">'+icon(x[3])+'<small>'+x[0]+'</small></div><strong>'+money(d[x[1]])+'</strong></div>'}).join('')+'</div>';
var operations='<div class="operations">'+[['صادرشده','issued','new'],['دریافت‌شده','received','scan'],['تحویل‌شده','delivered','box']].map(function(x){return '<div class="operation">'+icon(x[2])+'<strong>'+fmt(d[x[1]])+'</strong><span>'+x[0]+'</span></div>'}).join('')+'</div>';
set(title('گزارش مالی')+'<div class="report-toolbar">'+periods+'<div class="date-chip"><span>تاریخ شمسی</span><strong>'+esc(d.today)+'</strong></div></div>'+stats+'<div class="grid2 report-bottom">'+card(section('money','وصولی‌ها و مطالبات')+row('وصول‌شده',money(d.collected))+row('مطالبات کل',money(d.receivable)))+card(section('reports','تعداد عملیات')+operations)+'</div>')
}
function setPeriod(p){state.period=p;reports().catch(fail)}
async function settingsForm(){
state.settings=await api('/api/settings');
set(title('تنظیمات')+'<div class="settings-layout">'+card(section('route','مدیریت مقصدها')+'<div id="destlist" class="destinations"></div><div class="destination-entry">'+field('newdest','مقصد جدید','')+'<button class="btn secondary" onclick="addDest()">'+icon('new')+'افزودن مقصد</button></div><button class="btn" onclick="saveDest()">'+icon('save')+'ذخیره مقصدها</button>')+'<div class="settings-side">'+card(section('home','شعبه')+row('مبدأ','تهران'))+card(section('backup','پشتیبان‌گیری')+'<a href="/api/backup" class="btn secondary">'+icon('backup')+'دریافت پشتیبان</a>')+'</div></div>');renderDest()
}
function renderDest(){var e=document.getElementById("destlist");if(!e)return;
e.innerHTML=state.settings.destinations.map(function(d,i){
return '<div class="dest-row">'+icon('route')+'<span>'+esc(d)+'</span><button class="btn red" onclick="removeDest('+i+')">'+icon('delete')+'حذف</button></div>'
}).join("")||'<div class="muted">مقصدی نیست.</div>'
}
function addDest(){var e=document.getElementById("newdest");var d=(e.value||"").trim();
if(d&&!state.settings.destinations.includes(d)){state.settings.destinations.push(d);renderDest()}e.value=""}
function removeDest(i){state.settings.destinations.splice(i,1);renderDest()}
async function saveDest(){try{var r=await post("/api/settings",{destinations:state.settings.destinations});
state.settings.destinations=r.destinations;alert("ذخیره شد.");renderDest()}catch(e){fail(e)}}
(async function(){try{state.settings=await api("/api/settings");go("home")}catch(e){fail(e)}})();
</script>
</body>
</html>
