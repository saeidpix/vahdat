name: build-windows-installer
on:
  workflow_dispatch:
  push:
    branches: [release/v1, codex/print-layout-and-upgrade-safety]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: npm install --no-audit --no-fund
      - name: Check print regression
        run: node tests/print-regression.js
      - name: Build and smoke-test both installers (64-bit, then 32-bit)
        shell: pwsh
        run: |
          foreach ($arch in @("x64","ia32")) {
            # the native SQLite module must match the architecture of the packaged app
            Push-Location node_modules/better-sqlite3
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            npx prebuild-install -r electron -t 22.3.27 --arch $arch --platform win32
            if ($LASTEXITCODE -ne 0) { Write-Error "no prebuilt SQLite module for $arch"; exit 1 }
            Pop-Location
            npx electron-builder --win nsis "--$arch" --publish never
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $d = if ($arch -eq "x64") { "win-unpacked" } else { "win-ia32-unpacked" }
            $out = "$PWD\smoke-$arch.json"
            $env:SMOKE_OUT = $out
            $env:ELECTRON_ENABLE_LOGGING = "1"
            $p = Start-Process -FilePath "dist\$d\Barresan.exe" -ArgumentList "--smoke" -PassThru -Wait -RedirectStandardError "$PWD\err-$arch.txt" -RedirectStandardOutput "$PWD\out-$arch.txt"
            if (-not (Test-Path $out)) {
              Write-Host "::warning::$arch app did not finish with the default GPU setup on this runner; retrying with --in-process-gpu"
              if (Test-Path "$PWD\err-$arch.txt") { Get-Content "$PWD\err-$arch.txt" | Select-Object -Last 6 }
              $p = Start-Process -FilePath "dist\$d\Barresan.exe" -ArgumentList "--smoke","--in-process-gpu" -PassThru -Wait
            }
            Write-Host "exit code: $($p.ExitCode)"
            if (Test-Path "$out.stage") { Write-Host "last stage: $(Get-Content "$out.stage")" }
            if (-not (Test-Path $out)) { Write-Error "smoke test produced no result ($arch)"; exit 1 }
            Get-Content $out
            $r = Get-Content $out | ConvertFrom-Json
            if (-not $r.ok -or $r.arch -ne $arch) { Write-Error "smoke test failed ($arch)"; exit 1 }
          }
          Get-ChildItem dist\*.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: setup, path: dist/Barresan-Setup-*.exe }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-result, path: smoke-*.json }
