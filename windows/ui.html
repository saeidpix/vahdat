<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/logo.png">
<title>اتوبنز وحدت | مدیریت بارنامه</title>
<style>

:root{--navy:#102547;--blue:#2563d9;--red:#d84858;--green:#168768;--ink:#21324b;--muted:#7c899d;--paper:#f3f6fb;--line:#e4eaf3}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);font-size:14px}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.45;cursor:default;box-shadow:none}button:focus-visible,a:focus-visible{outline:3px solid #efb947;outline-offset:4px}.top{height:138px;display:flex;align-items:center;justify-content:space-between;background:radial-gradient(ellipse at 20% 80%,#284d79,transparent 55%),linear-gradient(110deg,#10213d,#142f55);color:#fff;padding:20px 34px;position:relative;overflow:hidden;border-bottom:4px solid #f0bd43}.brand{display:flex;align-items:center;gap:18px;z-index:1}.logo{width:82px;height:82px;object-fit:contain;background:#fff;border-radius:22px;padding:6px;box-shadow:0 8px 24px #0003}.brand h1{font-size:29px;margin:0;font-weight:800;letter-spacing:-1px}.top .right{height:100%;display:flex;align-items:center;gap:20px}.taxi{width:260px;height:125px;object-fit:contain;position:relative;filter:drop-shadow(0 8px 6px #0004)}.pill{padding:9px 14px;border-radius:9px;background:#ffffff12;border:1px solid #ffffff24;font-size:13px;white-space:nowrap}.shell{display:flex;min-height:calc(100vh - 138px)}.side{width:224px;min-width:224px;background:#fff;border-left:1px solid var(--line);padding:28px 14px}.nav{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:transparent;border-radius:13px;margin-bottom:9px;text-align:right;color:#617086;font-weight:600;transition:background .15s,color .15s}.nav:hover{background:#f1f5fc;color:var(--blue)}.nav.active{background:#2563d9;color:#fff;box-shadow:0 7px 15px #2563d92b}.sym{width:38px;height:38px;border-radius:11px;background:#edf3ff;color:#3d73d8;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.active .sym{background:#ffffff20;color:#fff}.nav:nth-child(3) .sym{color:#168768;background:#e5f6ef}.nav:nth-child(5) .sym{color:#865bc9;background:#f0eafd}.icon{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.content{width:min(1240px,100%);min-width:0;margin:0 auto;padding:32px 34px 50px}.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px}.pagehead h2{font-size:24px;margin:0;color:var(--navy);letter-spacing:-.5px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:24px;box-shadow:0 5px 20px #1c416305;margin-bottom:20px}.card h3{font-size:16px;margin:0 0 19px;color:var(--navy)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:22px}.tile{position:relative;overflow:hidden;min-height:194px;border:1px solid #d8e5fb;border-radius:20px;background:linear-gradient(145deg,#fff,#edf4ff);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;color:#2454a6;box-shadow:0 7px 18px #33548009;transition:transform .15s,box-shadow .15s}.tile:nth-child(2){background:linear-gradient(145deg,#fff,#e7f7ef);border-color:#d5ede1;color:#168768}.tile:nth-child(3){background:linear-gradient(145deg,#fff,#fff4df);border-color:#f0e4ca;color:#b17a1c}.tile:nth-child(4){background:linear-gradient(145deg,#fff,#f0eafe);border-color:#e7ddf9;color:#8054bd}.tile:hover{transform:translateY(-4px);box-shadow:0 12px 24px #203f7014}.tile:active{transform:translateY(0)}.tile .big{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;background:currentColor;box-shadow:0 7px 14px #183f8a17}.tile .big .icon{width:38px;height:38px;color:#fff;stroke-width:1.5}.tile strong{font-size:17px;color:var(--ink)}.field{display:flex;flex-direction:column;gap:9px;min-width:0}.field label{font-size:13px;font-weight:600;color:#617086}.field input,.field select{width:100%;height:48px;padding:11px 13px;border:1px solid #dbe3ed;border-radius:10px;background:#fbfcfe;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}.field input:focus,.field select:focus{border-color:#5c8fe5;box-shadow:0 0 0 3px #2563d914;background:#fff}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:20px 0}.btn{display:inline-flex;justify-content:center;align-items:center;gap:9px;background:linear-gradient(#3475e5,#2563d9);border:1px solid #205ac7;border-radius:10px;color:#fff;min-height:46px;padding:11px 23px;font-weight:600;box-shadow:0 3px 6px #2563d91a;text-decoration:none}.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}.btn.green{background:linear-gradient(#219975,#168768);border-color:#168768}.btn.red{background:#fff2f2;border:1px solid #f0d4d8;color:#bd3e50;box-shadow:none}.btn.secondary{background:#fff;border:1px solid #d4e0f2;color:#3769b7;box-shadow:none}.btn.gray{background:#eef1f7;border-color:#eef1f7;color:#617086}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.wide{width:100%}.keyrow{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #edf1f7;padding:14px 0;align-items:center}.keyrow:last-child{border-bottom:0}.keyrow span:first-child{color:#7c899d}.keyrow span:last-child{font-weight:600;text-align:left;overflow-wrap:anywhere}.sum{background:#e9f6f0;border:1px solid #d5eddf;border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:space-between;color:#147357;font-weight:700;margin-top:20px;font-size:17px}.money{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}.muted{color:#7c899d;padding:18px 0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;background:white}th,td{padding:17px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;background:#f7f9fd;color:#718199;font-weight:600}tr:hover td{background:#fbfcff}.tag{display:inline-block;border-radius:7px;padding:6px 11px;font-size:12px;background:#edf3ff;color:#3d73d8}.tag.green{background:#e7f5ee;color:#168768}.stat{padding:23px;border:1px solid #e1e9f7;border-radius:16px;background:#fff;min-width:0}.stat.green{border-top:3px solid #168768}.stat.purple{border-top:3px solid #865bc9}.stat small{color:#718199}.stat strong{display:block;margin-top:18px;font-size:20px;color:var(--navy);overflow-wrap:anywhere}.scanbox{min-height:340px;border:2px dashed #c4d5ef;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;padding:30px;background:radial-gradient(ellipse at center,#edf4ff,#fbfcfe 65%)}.scanbox>.icon{width:76px;height:76px;color:var(--blue)}.scanbox input{width:100%;max-width:650px;height:50px;border:1px solid #c9d8ed;border-radius:10px;padding:14px;background:#fff;outline:none}.qr{display:block;width:280px;max-width:100%;margin:15px auto}.spacer{height:8px}.message{padding:14px;border-radius:10px;background:#eff5ff;color:var(--navy);margin-bottom:16px}.message.err{background:#fff0f1;color:#b13f51}.home-route{display:flex;align-items:center;gap:15px;color:#60748d;font-size:15px}.home-route .icon{color:#d5a32e}.route-arrow{color:#a7b5c8}.section-title{display:flex;align-items:center;gap:10px}.section-title .icon{color:var(--blue)}
@media(min-width:1200px){.issuance{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,.9fr);gap:22px;align-items:start}.issuance>.card{margin-bottom:0}.issue-actions{justify-content:flex-end;margin-top:22px}}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:26px 22px}.side{width:200px;min-width:200px}.taxi{width:210px}.top{padding:18px 24px}.pill{display:none}}
@media(max-width:760px){.side{width:76px;min-width:76px;padding:22px 9px}.nav{padding:9px;justify-content:center}.nav .text{display:none}.content{padding:24px 18px}.brand h1{font-size:24px}.logo{width:66px;height:66px}.taxi{width:175px}.top{height:116px}.shell{min-height:calc(100vh - 116px)}.grid2{grid-template-columns:1fr}}
@media(max-width:520px){.top{height:96px;padding:12px 15px}.brand{gap:10px}.brand h1{font-size:20px}.logo{width:53px;height:53px;border-radius:15px}.taxi{width:120px;height:85px}.side{position:fixed;bottom:0;left:0;right:0;width:100%;height:70px;display:flex;z-index:5;padding:5px 3px;border-top:1px solid var(--line)}.nav{flex:1;margin:0;flex-direction:column;padding:3px;gap:4px;border-radius:8px}.nav .text{display:block;font-size:9px}.sym{width:29px;height:29px;border-radius:8px}.sym .icon{width:19px;height:19px}.shell{display:block}.content{padding:22px 13px 90px}.fields{grid-template-columns:1fr}.card{padding:20px}.tile{min-height:158px;gap:15px}.tile .big{width:60px;height:60px;border-radius:18px}.tile .big .icon{width:31px;height:31px}.tile strong{font-size:15px}.pagehead h2{font-size:21px}.grid4{gap:12px}.stat{padding:18px}.stat strong{font-size:17px}.sum{font-size:15px;padding:16px}.scanbox{padding:20px}.home-route{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{.top,.side,.pagehead,.toolbar,.btn,.noprint{display:none!important}.shell,.content{display:block;padding:0;width:100%}.card{border:0;box-shadow:none}.qr{width:250px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img class="logo" src="/logo.png" alt="لوگوی اتوبنز وحدت"><div><h1>اتوبنز وحدت</h1></div></div><div class="right"><span class="pill" id="branchLabel">تهران</span><img class="taxi" src="/assets/samand.png" alt="تاکسی سمند زرد"></div></header>
<div class="shell"><aside class="side">
<button type="button" class="nav active" id="nav-home" onclick="go('home')"><span class="sym"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg></span><span class="text">خانه</span></button>
<button type="button" class="nav" id="nav-new" onclick="go('new')"><span class="sym"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3H5v18h14V9Z"/><path d="M13 3v6h6M8 13h8M8 17h4"/><path d="M18 2v4M16 4h4"/></svg></span><span class="text">صدور بارنامه</span></button>
<button type="button" class="nav" id="nav-scan" onclick="go('scan')"><span class="sym"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M3 12h18"/><path d="M7 7h2v2H7zm8 0h2v2h-2zM7 15h2v2H7zm8 0h2v2h-2z"/></svg></span><span class="text">دریافت بار</span></button>
<button type="button" class="nav" id="nav-list" onclick="go('list')"><span class="sym"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h7M9 12h7M9 16h7M7 8h.01M7 12h.01M7 16h.01"/></svg></span><span class="text">بارنامه‌ها</span></button>
<button type="button" class="nav" id="nav-reports" onclick="go('reports')"><span class="sym"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18h17M8 17v-5m5 5V8m5 9V5"/><path d="m7 8 5-4 6-1"/></svg></span><span class="text">گزارش مالی</span></button>
<button type="button" class="nav" id="nav-settings" onclick="go('settings')"><span class="sym"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-1 3-3 1-3 3 2 2-1 3 3 3 3-1 2 4 3-2v-3l4-2-1-4-3-1-1-4Z"/><circle cx="11.5" cy="11.5" r="3"/></svg></span><span class="text">تنظیمات</span></button>
</aside><main class="content" id="page"></main></div>
<script>
"use strict";
var state={page:"home",settings:{origin:"تهران",destinations:["قائم‌شهر"]},current:null,period:"today"};
var fa=new Intl.NumberFormat("fa-IR");
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function latin(v){return String(v||"").replace(/[۰-۹]/g,function(d){return String(d.charCodeAt(0)-1776)}).replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-1632)})}
function num(v){return Number(latin(v).replace(/[^0-9]/g,"")||"0")}
function fmt(v){return fa.format(Number(v)||0)}
function money(v){return fmt(v)+" تومان"}
function groupField(el){var s=latin(el.value).replace(/\D/g,"");if(s.length>15)s=s.slice(0,15);el.value=s?fmt(s):"";calculate()}
function calculate(){var keys=["prepaid","post_fare","storage_fee","other_fee"];var total=keys.reduce(function(a,k){var e=document.getElementById(k);return a+num(e?e.value:0)},0);var e=document.getElementById("fareTotal");if(e)e.textContent=money(total)}
async function api(url,opts){var response=await fetch(url,Object.assign({cache:"no-store"},opts||{}));var data=await response.json();if(!response.ok)throw Error(data.error||"خطای ارتباط با برنامه");return data}
function post(url,value){return api(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(value)})}
function title(t,action){return '<div class="pagehead"><h2>'+esc(t)+'</h2>'+(action||"")+'</div>'}
function row(k,v){return '<div class="keyrow"><span>'+esc(k)+'</span><span>'+esc(v)+'</span></div>'}
function field(id,label,value,extra){return '<div class="field"><label for="'+esc(id)+'">'+esc(label)+'</label><input id="'+esc(id)+'" value="'+esc(value||"")+'" '+(extra||"")+'></div>'}
function card(content){return '<div class="card">'+content+'</div>'}
function set(html){document.getElementById("page").innerHTML=html;window.scrollTo({top:0,behavior:"instant"})}
function fail(e){alert(e.message||String(e))}
function nav(p){document.querySelectorAll(".nav").forEach(function(e){e.classList.toggle("active",e.id==="nav-"+p)})}
async function go(p){state.page=p;nav(p);try{
if(p==="home")home();
if(p==="new")newForm();
if(p==="scan")scanForm();
if(p==="list")await listings();
if(p==="reports")await reports();
if(p==="settings")await settingsForm();
}catch(e){fail(e)}}
function home(){set(title("خانه")+card('<div class="home-route"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="3"/><circle cx="19" cy="18" r="3"/><path d="M8 6h7a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8"/></svg><strong>تهران</strong><span class="route-arrow">←</span><span>'+esc(state.settings.destinations[0]||"—")+'</span></div>')+
'<div class="grid4">'+
'<button class="tile" onclick="go(&quot;new&quot;)"><span class="big"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3H5v18h14V9Z"/><path d="M13 3v6h6M8 13h8M8 17h4"/><path d="M18 2v4M16 4h4"/></svg></span><strong>صدور بارنامه</strong></button>'+
'<button class="tile" onclick="go(&quot;scan&quot;)"><span class="big"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M3 12h18"/><path d="M7 7h2v2H7zm8 0h2v2h-2zM7 15h2v2H7zm8 0h2v2h-2z"/></svg></span><strong>دریافت بار</strong></button>'+
'<button class="tile" onclick="go(&quot;list&quot;)"><span class="big"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h7M9 12h7M9 16h7M7 8h.01M7 12h.01M7 16h.01"/></svg></span><strong>بارنامه‌ها</strong></button>'+
'<button class="tile" onclick="go(&quot;reports&quot;)"><span class="big"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18h17M8 17v-5m5 5V8m5 9V5"/><path d="m7 8 5-4 6-1"/></svg></span><strong>گزارش مالی</strong></button></div>')}
function newForm(){
var destinations=state.settings.destinations||[];
destinations=destinations.slice().sort(function(a,b){return a==="قائم‌شهر"?-1:b==="قائم‌شهر"?1:0});
var dest='<div class="field"><label for="destination">مقصد</label><select id="destination">'+destinations.map(function(d){return '<option value="'+esc(d)+'">'+esc(d)+'</option>'}).join("")+'</select></div>';
var html=title("صدور بارنامه")+'<div class="issuance">'+card('<h3 class="section-title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4v11l-9 4-9-4Zm0 0 9 4 9-4M12 11v11M7 5l10 4v5"/></svg>مشخصات بار</h3>'+row("مبدأ","تهران")+
'<div class="fields">'+dest+
field("sender","نام فرستنده","")+field("receiver","نام گیرنده","")+
field("phone","موبایل گیرنده","")+field("pieces","تعداد بسته","۱",'inputmode="numeric"')+'</div>')+
card('<h3 class="section-title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>کرایه و هزینه‌ها (تومان)</h3><div class="fields">'+
field("prepaid","پیش‌کرایه","",'inputmode="numeric" class="money" oninput="groupField(this)"')+
field("post_fare","پس‌کرایه","",'inputmode="numeric" class="money" oninput="groupField(this)"')+
field("storage_fee","انبارداری","",'inputmode="numeric" class="money" oninput="groupField(this)"')+
field("other_fee","سایر هزینه‌ها","",'inputmode="numeric" class="money" oninput="groupField(this)"')+
'</div><div class="sum"><span>جمع کل کرایه</span><span id="fareTotal">۰ تومان</span></div>')+
'</div><div class="toolbar issue-actions"><button id="issueButton" class="btn" onclick="create()">صدور بارنامه</button></div>';
set(html)
}
async function create(){var button=document.getElementById("issueButton");if(button&&button.disabled)return;if(button)button.disabled=true;try{
var keys=["destination","sender","receiver","phone","pieces","prepaid","post_fare","storage_fee","other_fee"];
var d={};keys.forEach(function(k){var e=document.getElementById(k);d[k]=e?e.value:""});
if(!document.getElementById("destination"))d.destination=state.settings.destinations[0]||"";
["prepaid","post_fare","storage_fee","other_fee","pieces"].forEach(function(k){d[k]=num(d[k])});
var r=await post("/api/waybills",d);await showBill(r.waybill.id,true)
}catch(e){fail(e)}finally{if(button)button.disabled=false}}
function scanForm(){
set(title("دریافت بار")+card(
'<div class="scanbox"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M3 12h18"/><path d="M7 7h2v2H7zm8 0h2v2h-2zM7 15h2v2H7zm8 0h2v2h-2z"/></svg>'+
'<strong>دریافت QR</strong>'+
'<input id="qrInput" dir="ltr" autocomplete="off" spellcheck="false" placeholder="QR">'+
'<button class="btn green" onclick="importQr()">خواندن بارنامه</button></div>'));
var inp=document.getElementById("qrInput");inp.focus();
inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();importQr()}});
}
async function importQr(){try{
var input=document.getElementById("qrInput");if(!input||!input.value.trim())return;
var r=await post("/api/import",{qr:input.value.trim()});
await showBill(r.waybill.id,false);
if(!r.fresh)alert("قبلاً ثبت شده است.");
}catch(e){fail(e)}}
async function listings(){
var q=state.search||"";
set(title("بارنامه‌ها")+
card('<div class="field"><label>جست‌وجو</label><input id="search" value="'+esc(q)+'" placeholder="جست‌وجو..." oninput="searchBills(this.value)"></div>')+
'<div class="card" id="listContent">در حال دریافت...</div>');
await searchBills(q)}
var searchRequest=0;
async function searchBills(q){state.search=q;var requestId=++searchRequest;
try{
var data=await api("/api/waybills?q="+encodeURIComponent(q||""));
if(requestId!==searchRequest||state.page!=="list")return;
var html='<div class="tablewrap"><table><thead><tr><th>شماره</th><th>مسیر</th><th>گیرنده</th><th>جمع کل</th><th>وضعیت</th><th></th></tr></thead><tbody>';
data.items.forEach(function(b){
html+='<tr><td dir="ltr">'+fmt(b.number)+'</td><td>'+esc(b.origin)+' ← '+esc(b.destination)+'</td><td>'+esc(b.receiver)+'</td><td>'+money(b.total)+'</td><td><span class="tag '+(b.delivered_at?"green":"")+'">'+esc(b.status)+'</span></td><td><button class="btn secondary" data-id="'+esc(b.id)+'" onclick="showBill(this.dataset.id)">نمایش</button></td></tr>';
});
html+='</tbody></table></div>';
if(!data.items.length)html='<div class="muted">بارنامه‌ای نیست.</div>';
var e=document.getElementById("listContent");if(e)e.innerHTML=html;
}catch(e){fail(e)}}
async function showBill(id,showQR){
try{
state.current=id;
var r=await api("/api/waybills/"+encodeURIComponent(id));var b=r.waybill;
state.page="detail";nav("list");
var status=b.delivered_at?"green":"";
var html=title("جزئیات بارنامه",
'<div class="toolbar noprint"><button class="btn secondary" onclick="go(&quot;list&quot;)">بازگشت</button><button class="btn secondary" onclick="window.print()">چاپ</button></div>')+
'<div class="grid2"><div>'+card(
'<h3>مشخصات بارنامه <span class="tag '+status+'">'+esc(b.status)+'</span></h3>'+
row("شماره بارنامه",fmt(b.number))+row("مبدأ",b.origin)+row("مقصد",b.destination)+row("فرستنده",b.sender)+row("گیرنده",b.receiver)+row("موبایل گیرنده",b.phone)+row("تعداد بسته",fmt(b.pieces))+
row("صدور",b.created_at_fa)+(b.received_at?row("ثبت دریافت",b.received_at_fa):"")+
(b.delivered_at?row("ثبت تحویل",b.delivered_at_fa):""))+'</div><div>'+
card('<h3>حساب مالی</h3>'+row("پیش‌کرایه",money(b.prepaid))+
row("پس‌کرایه",money(b.post_fare))+row("انبارداری",money(b.storage_fee))+
row("سایر هزینه‌ها",money(b.other_fee))+
'<div class="sum"><span>جمع کل</span><span>'+money(b.total)+'</span></div>'+
row("مانده",money(b.due))+
(b.delivered_at?row("وصول‌شده در مقصد",money(b.post_collected)):""))+
card('<h3>QR بارنامه</h3><img class="qr" alt="QR بارنامه" src="/api/qr/'+encodeURIComponent(b.id)+'">')+'</div></div>';
if(!b.received_at)html+=card('<button class="btn green" onclick="receive()">ثبت دریافت بار</button>');
else if(!b.delivered_at)html+=card('<h3>تحویل بار به گیرنده</h3><div class="fields">'+
field("person","نام تحویل‌گیرنده",b.receiver)+
field("collected","مبلغ وصولی",fmt(b.due),'class="money" inputmode="numeric" oninput="groupField(this)"')+
'</div><button class="btn green" onclick="deliver()">ثبت تحویل</button>');
else html+=card('<div class="tag green">بار تحویل شده است</div>'+row("تحویل‌گیرنده",b.delivered_to));
set(html)
}catch(e){fail(e)}}
async function receive(){try{await post("/api/waybills/"+encodeURIComponent(state.current)+"/receive",{});showBill(state.current)}catch(e){fail(e)}}
async function deliver(){try{await post("/api/waybills/"+encodeURIComponent(state.current)+"/deliver",
{person:document.getElementById("person").value,collected:num(document.getElementById("collected").value)});showBill(state.current)}catch(e){fail(e)}}
async function reports(){
var p=state.period;
var d=await api("/api/reports?period="+p);
var periodButtons='<div class="toolbar">'+[
["today","امروز"],["month","این ماه"],["all","همه"]].map(function(x){
return '<button class="btn '+(p===x[0]?"":"secondary")+'" onclick="setPeriod(&quot;'+x[0]+'&quot;)">'+x[1]+'</button>'
}).join("")+"</div>";
var stats='<div class="grid4">'+[
["جمع کل کرایه","total",""],["پیش‌کرایه","prepaid","green"],["پس‌کرایه","post_fare",""],["انبارداری","storage_fee","purple"],["سایر هزینه‌ها","other_fee",""]].map(function(x){
return '<div class="stat '+x[2]+'"><small>'+x[0]+'</small><strong>'+money(d[x[1]])+'</strong></div>'
}).join("")+'</div>';
set(title("گزارش مالی")+card(periodButtons+row("تاریخ شمسی",d.today))+stats+
card('<h3>وصولی‌ها و مطالبات</h3>'+row("وصول‌شده",money(d.collected))+
row("مطالبات کل",money(d.receivable)))+
card('<h3>تعداد عملیات</h3>'+row("بارنامه صادرشده",fmt(d.issued))+
row("بار دریافت‌شده",fmt(d.received))+row("بار تحویل‌شده",fmt(d.delivered))))
}
function setPeriod(p){state.period=p;reports().catch(fail)}
async function settingsForm(){
var r=await api("/api/settings");state.settings=r;
set(title("تنظیمات")+
card('<h3>شعبه</h3>'+row("مبدأ","تهران"))+
card('<h3>مدیریت مقصدها</h3><div id="destlist"></div>'+
'<div class="fields">'+field("newdest","مقصد جدید","")+
'<div class="field"><label>&nbsp;</label><button class="btn secondary" onclick="addDest()">افزودن مقصد</button></div></div>'+
'<button class="btn" onclick="saveDest()">ذخیره مقصدها</button>')+
card('<h3>پشتیبان‌گیری</h3><a href="/api/backup" class="btn secondary" style="display:inline-block;text-decoration:none">دریافت پشتیبان</a>'));
renderDest()
}
function renderDest(){var e=document.getElementById("destlist");if(!e)return;
e.innerHTML=state.settings.destinations.map(function(d,i){
return '<div class="keyrow"><span>'+esc(d)+'</span><button class="btn red" onclick="removeDest('+i+')">حذف</button></div>'
}).join("")||'<div class="muted">مقصدی نیست.</div>'
}
function addDest(){var e=document.getElementById("newdest");var d=(e.value||"").trim();
if(d&&!state.settings.destinations.includes(d)){state.settings.destinations.push(d);renderDest()}e.value=""}
function removeDest(i){state.settings.destinations.splice(i,1);renderDest()}
async function saveDest(){try{var r=await post("/api/settings",{destinations:state.settings.destinations});
state.settings.destinations=r.destinations;alert("ذخیره شد.");renderDest()}catch(e){fail(e)}}
(async function(){try{state.settings=await api("/api/settings");go("home")}catch(e){fail(e)}})();
</script>
</body>
</html>
