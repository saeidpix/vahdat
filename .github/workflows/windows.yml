name: Windows installer
on:
  push:
    branches: [feature/windows-lan-demo]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'app/src/main/res/drawable/brand_logo.png'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt
          python -m pip install pyinstaller==6.16.0 playwright==1.56.0
          python -m playwright install chromium
      - name: Prepare official brand logo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/assets | Out-Null
          Copy-Item app/src/main/res/drawable/brand_logo.png windows/assets/logo.png
          python -c "from PIL import Image; Image.open('windows/assets/logo.png').convert('RGBA').save('windows/assets/logo.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128)])"
      - name: Verify JavaScript syntax and page interactions
        shell: pwsh
        run: node windows/test_ui.cjs
      - name: Run Windows functional tests
        shell: pwsh
        run: |
          python -m unittest discover -s windows -p test_*.py -v
          if ($LASTEXITCODE -ne 0) { throw "Backend tests failed" }
          python windows/browser_test.py
      - name: Build portable Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name VahdatServer --icon "windows/assets/logo.ico" --add-data "windows/ui.html;." --add-data "windows/assets/logo.png;." --add-data "windows/assets;assets" windows/app.py
          if (-not (Test-Path "dist/VahdatServer.exe")) { throw "EXE missing" }
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $env:PROGRAMDATA = Join-Path $env:RUNNER_TEMP "vahdat-packaged-test"
          $process = Start-Process dist/VahdatServer.exe -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8765/api/health
                if ($health.version -eq '1.0.0') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "Packaged server did not start" }
            foreach ($path in @('/', '/logo.png', '/assets/samand.png')) {
              $response = Invoke-WebRequest ("http://127.0.0.1:8765" + $path)
              if ($response.StatusCode -ne 200) { throw "Packaged asset missing: $path" }
            }
          } finally { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vahdat-UI-Verification
          path: browser-results/*.png
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw "Inno compiler missing" }
      - name: Build installable setup EXE
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows/install.iss"
          if (-not (Test-Path "dist/installer/Vahdat-Setup-Windows-v1.0.0.exe")) { throw "Setup missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: Vahdat-Windows-Installer-v1.0.0
          path: dist/installer/Vahdat-Setup-Windows-v1.0.0.exe
          if-no-files-found: error
